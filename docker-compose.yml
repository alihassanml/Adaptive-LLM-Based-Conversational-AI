version: '3.8'

services:
  backend:
    build: ./backend
    image: alihassan/backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - appnet

  frontend:
    build: ./frontend
    image: alihassan/frontend:latest
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    networks:
      - appnet

networks:
  appnet:
